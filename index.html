<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>H&amp;A Player</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">
  <!-- Password gate: a "tinted window" to keep casual visitors out, NOT real security. -->
  <form id="gate" class="gate" autocomplete="off">
    <h1>H&amp;A Player</h1>
    <label for="gate-pw">Password</label>
    <input id="gate-pw" type="password" autocomplete="current-password" required>
    <button type="submit">Enter</button>
    <p id="gate-error" class="gate-error" role="alert"></p>
  </form>

  <!-- Episode list view -->
  <main id="list-view" class="view">
    <header class="bar">
      <h1 id="list-title">Hamish &amp; Andy</h1>
      <button id="sync-btn" class="icon-btn sync-btn" aria-label="Sync settings" data-state="off">☁</button>
      <button id="refresh" class="icon-btn" aria-label="Refresh episode list">⟳</button>
    </header>
    <nav id="show-tabs" class="show-tabs" aria-label="Podcast"></nav>
    <p id="list-status" class="status" role="status">Loading episodes…</p>
    <ul id="episodes" class="episodes"></ul>
  </main>

  <!-- Player view -->
  <main id="player-view" class="view" hidden>
    <header class="bar">
      <button id="back" class="icon-btn" aria-label="Back to episode list">←</button>
      <h1 id="ep-title" class="ep-title"></h1>
    </header>

    <section class="player" aria-label="Player">
      <p id="current-chapter" class="current-chapter" aria-live="polite"></p>

      <div id="seek-wrap" class="seek">
        <div class="seek-bar">
          <div id="seek-track" class="seek-track" aria-hidden="true"></div>
          <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek">
        </div>
        <div class="times">
          <span id="time-cur">0:00</span>
          <span id="time-dur">0:00</span>
        </div>
        <div class="seek-loading" role="progressbar" aria-label="Loading episode" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="ring" aria-hidden="true"></span><span id="load-pct">Loading… 0%</span>
        </div>
      </div>

      <div class="controls">
        <button id="back10" class="ctrl" aria-label="Back 10 seconds">−10</button>
        <button id="play" class="ctrl play" aria-label="Play">▶</button>
        <button id="fwd10" class="ctrl" aria-label="Forward 10 seconds">+10</button>
      </div>

      <button id="mark-done" class="mark-done" type="button" aria-pressed="false">Mark as played</button>
    </section>

    <section id="chapters-section" aria-label="Chapters">
      <h2 class="section-title">Chapters</h2>
      <p id="chapter-status" class="status" role="status"></p>
      <ol id="chapters" class="chapters"></ol>
    </section>
  </main>

  <!-- Sync settings -->
  <dialog id="sync-dialog" class="sync-dialog" aria-labelledby="sync-title">
    <h2 id="sync-title">Sync between devices</h2>
    <p id="sync-status" class="sync-status" role="status"></p>
    <p>Sign in with the same Google account on each device to keep listening progress in sync.</p>
    <div class="sync-actions">
      <button id="sync-signin" type="button" class="primary">Sign in with Google</button>
      <button id="sync-signout" type="button" hidden>Sign out</button>
      <button id="sync-close" type="button">Close</button>
    </div>
  </dialog>

  <audio id="audio" preload="metadata"></audio>

  <script src="id3.js"></script>
  <script src="ads.js"></script>
  <script src="progress.js"></script>
  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>

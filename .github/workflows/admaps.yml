# Builds ad maps (admaps/<guid>.json) for new Lemonade Stand and Triforce episodes.
# See tools/admap.py for how they're made and ads.js for how the player uses them.
name: Ad maps

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      limit:
        description: "Make sure the newest N episodes of each show have maps"
        default: "10"

permissions:
  contents: write

concurrency:
  group: admaps

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build missing maps
        # No H&A: Omny picks ads by location, and from GitHub's US runners it mostly serves
        # none (or US ads at different spots), so the maps would be wrong for Australia.
        # Build H&A maps locally: python3 tools/admap.py --shows handa
        run: python3 tools/admap.py --shows lemonade triforce --limit "${{ github.event.inputs.limit || '10' }}"
      - name: Commit new maps
        env:
          # Needed for both the commit and the rebase (which rewrites it as a new commit).
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add admaps
          if git diff --cached --quiet; then echo "No new maps"; exit 0; fi
          git commit -m "Add ad maps"
          git pull --rebase origin main
          git push origin HEAD:main
